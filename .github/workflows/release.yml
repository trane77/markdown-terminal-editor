# Builds the mdedit binaries and publishes them as a GitHub release whenever a v* tag is pushed.
# Tags are created by scripts/release.sh.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/mdedit${{ matrix.ext }} \
             dist/mdedit-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Relative links (screenshots in docs/, LICENSE) point to the files at this tag, so the
      # attached README shows the screenshots of this release, not the ones on main.
      - name: Pin README links to the tag
        run: |
          sed -E "s#\]\(([^)#][^):]*)\)#](https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_REF_NAME/\1)#g" \
            README.md > dist/README.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* LICENSE --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
